<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Beautiful TodoApp - todos with style" />
    <meta name="theme-color" content="#0b0d17" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Beautiful Todo" />
    <meta
      property="og:description"
      content="Production-grade todo app: end-to-end type safety from Postgres to UI, auth, i18n, tests, CI, Lighthouse budgets"
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Background loads before the app: the browser picks a candidate by viewport width (avif), the rest take srcset from <picture> -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/src/shared/ui/assets/images/city-1920.avif"
      imagesrcset="/src/shared/ui/assets/images/city-1920.avif 1920w, /src/shared/ui/assets/images/city-2560.avif 2560w"
      imagesizes="100vw"
    />
    <title>Beautiful Todo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
