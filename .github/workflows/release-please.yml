name: Release please

on:
  push:
    branches: [main]

# GITHUB_TOKEN: the action creates the release PR, tags and GitHub Releases; no external secrets
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}

jobs:
  release:
    name: release PR and GitHub releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
